name: Release

# 推 v* 标签时自动构建单文件版并发布 Release；也可在 Actions 页手动触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 发布单文件版
        run: >
          dotnet publish WSLCManager.csproj
          -c Release -r win-x64
          -p:PublishSingleFile=true
          -p:PublishSelfContained=false
          -o publish

      - name: 创建或更新 Release 并上传附件
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          TITLE="${GITHUB_REF_NAME}"
          if [ -f "$NOTES" ]; then
            TITLE="$(head -1 "$NOTES")"
            tail -n +2 "$NOTES" > "$RUNNER_TEMP/notes.md"
          else
            printf '（本版本没有单独的 Release 说明，以下为自动生成。）\n' > "$RUNNER_TEMP/notes.md"
          fi

          # 不依赖 `gh release view` 的探测结果：直接建，建不成说明已存在，再改为更新。
          if gh release create "${GITHUB_REF_NAME}" publish/WSLCManager.exe \
               --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" 2>/dev/null; then
            echo "已创建新的 Release：${GITHUB_REF_NAME}"
          else
            echo "Release 已存在 → 更新标题与说明，并覆盖附件"
            gh release edit "${GITHUB_REF_NAME}" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "${GITHUB_REF_NAME}" publish/WSLCManager.exe --clobber
          fi

          # GitHub 删除标签时会**连带删除**该标签上的 Release，而这个删除动作可能延迟到
          # 本步骤之后才执行 —— 于是「删标签再重建」这种触发方式下，刚建好的 Release
          # 会被随后的删除任务清掉（构建日志全绿、release 却查不到，就是这个原因）。
          # 所以建完复查几轮，发现被清就立刻重建，保证跑完一定留得下一个 Release。
          for i in 1 2 3 4; do
            sleep 20
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              echo "第 ${i} 次复查：Release 在位"
              gh release view "${GITHUB_REF_NAME}" --json tagName,name,isDraft,isPrerelease
              exit 0
            fi
            echo "第 ${i} 次复查：Release 不在，重建"
            gh release create "${GITHUB_REF_NAME}" publish/WSLCManager.exe \
              --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" || true
          done
          echo "::error::建成之后 Release 仍不存在，请检查仓库的 Releases 权限设置"
          exit 1
